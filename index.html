
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đếm Ngược Tết Nguyên Đán</title>
    <!--    <link rel="stylesheet" href="style.css">-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at top, #3b0000, #000);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 20px #ff0000;
        }

        #countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .time-box {
            background: linear-gradient(145deg, #8b0000, #ff0000);
            padding: 20px;
            width: 110px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .time-box span {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
        }

        .time-box small {
            font-size: 1rem;
            opacity: 0.9;
        }

        .footer {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #ffd700;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎆 Đếm Ngược Tết Nguyên Đán 🎆</h1>

    <div id="countdown">
        <div class="time-box">
            <span id="days">0</span>
            <small>Ngày</small>
        </div>
        <div class="time-box">
            <span id="hours">0</span>
            <small>Giờ</small>
        </div>
        <div class="time-box">
            <span id="minutes">0</span>
            <small>Phút</small>
        </div>
        <div class="time-box">
            <span id="seconds">0</span>
            <small>Giây</small>
        </div>
    </div>

    <p class="footer">✨ Chúc Mừng Năm Mới ✨</p>
</div>

<!--<script src="script.js"></script>-->
<script>
    function getNextLunarNewYear() {
        // Tết Nguyên Đán 2026 (ví dụ: 17/02/2026)
        return new Date("2026-02-17T00:00:00");
    }

    function updateCountdown() {
        const tet = getNextLunarNewYear();
        const now = new Date();
        const diff = tet - now;

        if (diff <= 0) {
            document.getElementById("countdown").innerHTML =
                "<h2>🎉 Chúc Mừng Năm Mới 🎉</h2>";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>
</body>
</html>
